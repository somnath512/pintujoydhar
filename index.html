<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>Pintu Joydhar - Web Developer</title>
                        <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #1e293b;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .logo span {
            color: #38bdf8;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }

        .btn-nav {
            background: #38bdf8;
            color: #0f172a !important;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 80vh;
            padding: 40px 20px;
        }

        /* Profile Image Style */
        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            margin-bottom: 25px;
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero p {
            max-width: 600px;
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-secondary {
            border: 2px solid #38bdf8;
            color: #38bdf8;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
                        <div class="logo">Pintu <span>Joydhar</span></div>
        
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#services">Service</a></li>
                <li><a href="#about">My Line</a></li>
                <li><a href="#contact" class="btn-nav">Contract</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <!-- Profile Image -->
        <img src="profile.jpg" alt="Pintu Joydhar" class="profile-img">
        
        <h1>HI, I am <span>Pintu Joydhar</span></h1>
        <p>I am preparing for a Junior Accountant role, and writing poetry is a personal passion of mine</p>
        
        <div class="btn-container">
            <a href="#services" class="btn-primary">আমার সার্ভিসসমূহ</a>
            <a href="#contact" class="btn-secondary">যোগাযোগ করুন</a>
        </div>
    </section>

</body>
</html>
