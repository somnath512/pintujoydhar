<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintu Joydhar - Website</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-green: #7cc142;
            --brand-blue: #0099de;
            --brand-dark-blue: #1e2d3b;
            --bg-light: #f5f7fa;
            --text-dark: #333333;
            --text-gray: #777777;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* Top Bar */
        .top-bar {
            background: #ffffff;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4%;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 700;
            color: #0d4a75;
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--brand-green);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        /* Menu items uniform color setup */
        .nav-menu li a {
            text-decoration: none;
            color: #0d4a75;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .nav-menu li a i {
            color: var(--brand-green);
        }

        .nav-menu li a:hover {
            color: var(--brand-blue);
        }

        .btn-signup {
            background: var(--brand-blue);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s;
        }

        .btn-signup:hover {
            background: #007bb5;
        }

        /* Hero Banner - Full Image Fitting */
        .hero-section {
            background: url('https://lh3.googleusercontent.com/d/1TAf3Aud6gYxHWmJ6RAbC5JNJ0iYCvhad=s1000') no-repeat center center;
            background-size: 100% 100%;
            width: 100%;
            height: 480px;
            position: relative;
        }

        @media (max-width: 900px) {
            .hero-section {
                height: 300px;
            }
        }

        @media (max-width: 600px) {
            .hero-section {
                height: 200px;
            }
        }

        /* Content Body Container */
        .main-container {
            width: 85%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .section-header-title {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .section-header-title span {
            font-size: 12px;
            color: #888;
            font-weight: 400;
        }

        /* 3-Column Deals Grid */
        .deals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 50px;
        }

        @media (max-width: 900px) {
            .deals-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-menu { gap: 12px; }
        }

        @media (max-width: 600px) {
            .deals-grid { grid-template-columns: 1fr; }
            .nav-menu { display: none; }
        }

        .deal-card {
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .deal-card:hover {
            transform: translateY(-4px);
        }

        .card-img-box {
            position: relative;
            height: 170px;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .price-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ffffff;
            color: var(--brand-blue);
            font-weight: 700;
            font-size: 13px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: 2px solid #f0f0f0;
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: #222222;
            text-transform: uppercase;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .card-subtext {
            font-size: 11px;
            color: #888888;
        }

        /* Signup Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            position: relative;
            text-align: center;
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }

        .modal-title {
            font-size: 20px;
            color: #0d4a75;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .modal-subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        .btn-submit {
            width: 100%;
            background: var(--brand-blue);
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            margin-top: 5px;
        }

        .google-btn {
            width: 100%;
            background: #ffffff;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            color: #444;
        }

        .divider {
            margin: 15px 0;
            font-size: 12px;
            color: #888;
            position: relative;
        }

        /* Footer */
        footer {
            background: #111a22;
            color: #778899;
            text-align: center;
            padding: 30px;
            font-size: 12px;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <!-- Header / Top Navigation -->
    <div class="top-bar">
        <a href="#" class="brand-logo">Pintu <span>Joydhar</span></a>
        <ul class="nav-menu">
            <li><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="#"><i class="fa-solid fa-heart"></i> My Life</a></li>
            <li><a href="#"><i class="fa-solid fa-blog"></i> Blog</a></li>
            <li><a href="#"><i class="fa-solid fa-address-book"></i> Contact</a></li>
            <li><a href="#"><i class="fa-solid fa-user"></i> About</a></li>
        </ul>
        <button class="btn-signup" onclick="openModal()">SIGN UP</button>
    </div>

    <!-- Hero Banner with Full Image Fit -->
    <div class="hero-section"></div>

    <!-- Main Body Layout -->
    <div class="main-container">

        <!-- Grid Deals Section -->
        <h2 class="section-header-title">EDITOR'S BEST TRAVEL DEALS* <span>(OCT 12 - OCT 18)</span></h2>
        
        <div class="deals-grid" id="dealsGrid">
            <!-- Dynamic items rendered from JS -->
        </div>

    </div>

    <!-- Signup Modal Container -->
    <div class="modal-overlay" id="signupModal">
        <div class="modal-box">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 class="modal-title">Create Account</h3>
            <p class="modal-subtitle">Sign up with your Gmail account to get started</p>
            
            <button class="google-btn" onclick="googleSignup()">
                <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Gmail
            </button>

            <div class="divider">OR</div>

            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Gmail Address</label>
                    <input type="email" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn-submit">CREATE ACCOUNT</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        © 2026 Pintu Joydhar - All Rights Reserved.
    </footer>

    <script>
        const googleSheetApiUrl = 'https://script.google.com/macros/s/AKfycbzppUd_xG-fG50K3uF19U--QwxON2Xc7hASlhMin3L99ZTBo--vt-WThREhN5_D9E/exec';

        document.addEventListener('DOMContentLoaded', () => {
            fetchDeals();
        });

        /* Modal Functions */
        function openModal() {
            document.getElementById('signupModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('signupModal').style.display = 'none';
        }

        function googleSignup() {
            alert("Redirecting to Gmail Account Login...");
        }

        function handleSignup(event) {
            event.preventDefault();
            alert("Account created successfully with Gmail!");
            closeModal();
        }

        function fetchDeals() {
            fetch(googleSheetApiUrl)
                .then(res => res.json())
                .then(data => renderDeals(data))
                .catch(() => loadFallbackDeals());
        }

        function renderDeals(posts) {
            if (!posts || posts.length === 0) {
                loadFallbackDeals();
                return;
            }

            let html = '';
            posts.forEach(post => {
                let img = (post.image && post.image.startsWith('http')) ? post.image : 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80';
                html += `
                    <div class="deal-card">
                        <div class="card-img-box">
                            <img src="${img}" alt="Deal Image">
                            <div class="price-badge">$544</div>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">${post.title || '7-NT CELEBRITY CARIBBEAN CRUISE W/ PERKS'}</h3>
                            <p class="card-subtext">Reg $41398. UP TO $2000 Credit</p>
                        </div>
                    </div>
                `;
            });
            document.getElementById('dealsGrid').innerHTML = html;
        }

        function loadFallbackDeals() {
            let sampleImages = [
                'https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=500&q=80',
                'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80',
                'https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=500&q=80'
            ];

            let html = '';
            for (let i = 0; i < 3; i++) {
                html += `
                    <div class="deal-card">
                        <div class="card-img-box">
                            <img src="${sampleImages[i]}" alt="Deal Image">
                            <div class="price-badge">$544</div>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">7-NT CELEBRITY CARIBBEAN CRUISE W/ PERKS</h3>
                            <p class="card-subtext">Reg $41398. UP TO $2000 Credit</p>
                        </div>
                    </div>
                `;
            }
            document.getElementById('dealsGrid').innerHTML = html;
        }
    </script>
</body>
</html>
