<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio & News Feed</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

    <!-- Top Navigation / Header -->
    <header class="w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex justify-between items-center mb-8">
        <div>
            <!-- id="user-name" এবং id="user-title" এর মাধ্যমে নাম ও প্রফেশন শো করবে -->
            <h1 class="text-2xl font-bold text-indigo-400" id="user-name">Welcome</h1>
            <p class="text-sm text-slate-400" id="user-title">Profession</p>
        </div>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-500 transition px-4 py-2 rounded-lg text-sm font-semibold shadow-md">Logout</button>
    </header>

    <!-- Main Content Section -->
    <main id="home" class="w-full max-w-4xl space-y-6">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-semibold mb-2 text-indigo-300">News Feed & Dashboard</h2>
            <p class="text-slate-400 text-sm">Welcome to your portfolio and news feed platform!</p>
        </div>
    </main>

    <!-- JavaScript to Load User Data & Handle Authentication Check -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('userProfile');
            
            // যদি কেউ লগইন না করে সরাসরি index.html এ আসে, তাকে login.html এ পাঠিয়ে দিবে
            if (!savedUser) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(savedUser);
            
            // ইউজারের নাম ও টাইটেল সেট করা
            const nameElement = document.getElementById('user-name');
            const titleElement = document.getElementById('user-title');
            
            if (nameElement) {
                nameElement.innerText = "Welcome, " + (user.name || user.email);
            }
            if (titleElement) {
                titleElement.innerText = user.title || 'Member';
            }
        });

        function logout() {
            localStorage.removeItem('userProfile');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
