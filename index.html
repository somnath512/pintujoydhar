<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintu Joydhar - Website</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-green: #7cc142;
            --brand-blue: #0099de;
            --brand-dark-blue: #1e2d3b;
            --bg-light: #f5f7fa;
            --text-dark: #333333;
            --text-gray: #777777;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* Top Bar */
        .top-bar {
            background: #ffffff;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4%;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 700;
            color: #0d4a75;
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--brand-green);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        /* Menu items uniform color setup */
        .nav-menu li a {
            text-decoration: none;
            color: #0d4a75;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .nav-menu li a i {
            color: var(--brand-green);
        }

        .nav-menu li a:hover {
            color: var(--brand-blue);
        }

        .btn-signup {
            background: var(--brand-blue);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Hero Banner - Full Space Coverage (No empty gaps) */
        .hero-section {
            background: url('https://lh3.googleusercontent.com/d/1TAf3Aud6gYxHWmJ6RAbC5JNJ0iYCvhad=s1000') no-repeat center center;
            background-size: cover;
            width: 100%;
            height: 480px;
            position: relative;
        }

        @media (max-width: 900px) {
            .hero-section {
                height: 300px;
            }
        }

        @media (max-width: 600px) {
            .hero-section {
                height: 200px;
            }
        }

        /* Content Body Container */
        .main-container {
            width: 85%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .section-header-title {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .section-header-title span {
            font-size: 12px;
            color: #888;
            font-weight: 400;
        }

        /* 3-Column Deals Grid */
        .deals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 50px;
        }

        @media (max-width: 900px) {
            .deals-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-menu { gap: 12px; }
        }

        @media (max-width: 600px) {
            .deals-grid { grid-template-columns: 1fr; }
            .nav-menu { display: none; }
        }

        .deal-card {
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .deal-card:hover {
            transform: translateY(-4px);
        }

        .card-img-box {
            position: relative;
            height: 170px;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .price-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ffffff;
            color: var(--brand-blue);
            font-weight: 700;
            font-size: 13px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: 2px solid #f0f0f0;
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: #222222;
            text-transform: uppercase;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .card-subtext {
            font-size: 11px;
            color: #888888;
        }

        /* Destination Grid Layout */
        .destinations-section {
            margin-top: 50px;
            text-align: center;
        }

        .dest-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            grid-template-areas: 
                "fl cal cal lv"
                "hw cal cal ch";
        }

        .dest-item {
            position: relative;
            height: 140px;
            border-radius: 3px;
            overflow: hidden;
        }

        .dest-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dest-title {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .dest-california {
            grid-area: cal;
            height: 295px;
        }

        .dest-california .dest-content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: #fff;
            text-align: left;
        }

        /* Footer */
        <footer>
            © 2026 Pintu Joydhar - All Rights Reserved.
        </footer>

    </style>
</head>
<body>

    <!-- Header / Top Navigation -->
    <div class="top-bar">
        <a href="#" class="brand-logo">Pintu <span>Joydhar</span></a>
        <ul class="nav-menu">
            <li><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="#"><i class="fa-solid fa-heart"></i> My Life</a></li>
            <li><a href="#"><i class="fa-solid fa-blog"></i> Blog</a></li>
            <li><a href="#"><i class="fa-solid fa-address-book"></i> Contact</a></li>
            <li><a href="#"><i class="fa-solid fa-user"></i> About</a></li>
        </ul>
        <button class="btn-signup">SIGN UP</button>
    </div>

    <!-- Hero Banner with Full Space Cover View -->
    <div class="hero-section"></div>

    <!-- Main Body Layout -->
    <div class="main-container">

        <!-- Grid Deals Section -->
        <h2 class="section-header-title">EDITOR'S BEST TRAVEL DEALS* <span>(OCT 12 - OCT 18)</span></h2>
        
        <div class="deals-grid" id="dealsGrid">
            <!-- Dynamic items rendered from JS -->
        </div>

        <!-- Destination Section -->
        <div class="destinations-section">
            <h2 class="section-header-title">TOP TRAVEL DESTINATIONS</h2>
            <div class="dest-grid">
                <div class="dest-item"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=400&q=80"><span class="dest-title"><i class="fa-solid fa-location-dot"></i> Florida</span></div>
                <div class="dest-item dest-california">
                    <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=800&q=80">
                    <div class="dest-content">
                        <h3><i class="fa-solid fa-location-dot"></i> CALIFORNIA</h3>
                        <p style="font-size: 11px; margin-top:5px;">Explore luxury nature & coastlines in California deals.</p>
                    </div>
                </div>
                <div class="dest-item"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=400&q=80"><span class="dest-title"><i class="fa-solid fa-location-dot"></i> Las Vegas</span></div>
                <div class="dest-item"><img src="https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=400&q=80"><span class="dest-title"><i class="fa-solid fa-location-dot"></i> Hawaii</span></div>
                <div class="dest-item"><img src="https://images.unsplash.com/photo-1477959858617-67f30ac4ce78?auto=format&fit=crop&w=400&q=80"><span class="dest-title"><i class="fa-solid fa-location-dot"></i> Chicago</span></div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        © 2026 Pintu Joydhar - All Rights Reserved.
    </footer>

    <script>
        const googleSheetApiUrl = 'https://script.google.com/macros/s/AKfycbzppUd_xG-fG50K3uF19U--QwxON2Xc7hASlhMin3L99ZTBo--vt-WThREhN5_D9E/exec';

        document.addEventListener('DOMContentLoaded', () => {
            fetchDeals();
        });

        function fetchDeals() {
            fetch(googleSheetApiUrl)
                .then(res => res.json())
                .then(data => renderDeals(data))
                .catch(() => loadFallbackDeals());
        }

        function renderDeals(posts) {
            if (!posts || posts.length === 0) {
                loadFallbackDeals();
                return;
            }

            let html = '';
            posts.forEach(post => {
                let img = (post.image && post.image.startsWith('http')) ? post.image : 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80';
                html += `
                    <div class="deal-card">
                        <div class="card-img-box">
                            <img src="${img}" alt="Deal Image">
                            <div class="price-badge">$544</div>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">${post.title || '7-NT CELEBRITY CARIBBEAN CRUISE W/ PERKS'}</h3>
                            <p class="card-subtext">Reg $41398. UP TO $2000 Credit</p>
                        </div>
                    </div>
                `;
            });
            document.getElementById('dealsGrid').innerHTML = html;
        }

        function loadFallbackDeals() {
            let sampleImages = [
                'https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=500&q=80',
                'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80',
                'https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=500&q=80',
                'https://images.unsplash.com/photo-1476514525535-ce74f452899d?auto=format&fit=crop&w=500&q=80',
                'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=500&q=80',
                'https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?auto=format&fit=crop&w=500&q=80',
                'https://images.unsplash.com/photo-1515238152791-8216bfdf89a7?auto=format&fit=crop&w=500&q=80',
                'https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?auto=format&fit=crop&w=500&q=80',
                'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=500&q=80'
            ];

            let html = '';
            for (let i = 0; i < 9; i++) {
                html += `
                    <div class="deal-card">
                        <div class="card-img-box">
                            <img src="${sampleImages[i]}" alt="Deal Image">
                            <div class="price-badge">$544</div>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">7-NT CELEBRITY CARIBBEAN CRUISE W/ PERKS</h3>
                            <p class="card-subtext">Reg $41398. UP TO $2000 Credit</p>
                        </div>
                    </div>
                `;
            }
            document.getElementById('dealsGrid').innerHTML = html;
        }
    </script>
</body>
</html>
