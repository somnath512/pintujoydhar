<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomadic Matt Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>Travel smarter, cheaper, longer</h1>
            <p>Where do you want to go?</p>
            <div class="search-box">
                <input type="text" placeholder="Find your destination">
                <button>Find your destination</button>
            </div>
            <p class="popular-searches">
                <strong>Popular Searches:</strong> Southeast Asia, Europe, travel hacking, insurance, Paris
            </p>
        </div>
    </header>

    <!-- Newsletter Section -->
    <section class="newsletter">
        <h2>GET MY BEST TIPS SENT STRAIGHT TO YOU!</h2>
        <form>
            <input type="text" placeholder="First Name">
            <input type="email" placeholder="Email Address">
            <button type="submit">SEND ME TIPS</button>
        </form>
    </section>

    <!-- Categories / Grid Section -->
    <section class="grid-section">
        <h2>Start Planning Your Trip</h2>
        <div class="card-grid">
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1488646953014-85cb44e25828')">
                <h3>Getting Inspired</h3>
            </div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1503220317375-aaad61436b1b')">
                <h3>How to Save for a Trip</h3>
            </div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800')">
                <h3>How to Plan Your Trip</h3>
            </div>
        </div>
    </section>

</body>
</html>
