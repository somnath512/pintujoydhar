<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintu Joydhar - Website</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-green: #7cc142;
            --brand-blue: #0099de;
            --brand-dark-blue: #1e2d3b;
            --bg-light: #f5f7fa;
            --text-dark: #333333;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* Top Bar */
        .top-bar {
            background: #ffffff;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4%;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 700;
            color: #0d4a75;
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--brand-green);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-menu li a {
            text-decoration: none;
            color: #0d4a75;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-signup {
            background: var(--brand-blue);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Hero Banner */
        .hero-section {
            background: url('https://lh3.googleusercontent.com/d/1TAf3Aud6gYxHWmJ6RAbC5JNJ0iYCvhad=s1000') no-repeat center center;
            background-size: 100% 100%;
            width: 100%;
            height: 480px;
        }

        .main-container {
            width: 85%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .section-header-title {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .deals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .deal-card {
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        .card-img-box {
            position: relative;
            height: 170px;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .price-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ffffff;
            color: var(--brand-blue);
            font-weight: 700;
            font-size: 13px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #f0f0f0;
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: #222222;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        /* Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 8px;
            position: relative;
            text-align: center;
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        .btn-submit {
            width: 100%;
            background: var(--brand-blue);
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        footer {
            background: #111a22;
            color: #778899;
            text-align: center;
            padding: 30px;
            font-size: 12px;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <a href="#" class="brand-logo">Pintu <span>Joydhar</span></a>
        <ul class="nav-menu">
            <li><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="#"><i class="fa-solid fa-heart"></i> My Life</a></li>
            <li><a href="#"><i class="fa-solid fa-blog"></i> Blog</a></li>
            <li><a href="#"><i class="fa-solid fa-address-book"></i> Contact</a></li>
        </ul>
        <button class="btn-signup" onclick="openModal()">SIGN UP</button>
    </div>

    <!-- Hero Banner -->
    <div class="hero-section"></div>

    <!-- Main Container -->
    <div class="main-container">
        <h2 class="section-header-title">EDITOR'S BEST TRAVEL DEALS*</h2>
        <div class="deals-grid" id="dealsGrid">
            <div class="deal-card">
                <div class="card-img-box">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80" alt="Deal">
                    <div class="price-badge">$544</div>
                </div>
                <div class="card-body">
                    <h3 class="card-title">7-NT CELEBRITY CARIBBEAN CRUISE</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Signup Modal -->
    <div class="modal-overlay" id="signupModal">
        <div class="modal-box">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="signupFormContainer">
                <h3 style="margin-bottom: 15px; color: #0d4a75;">Create Account</h3>
                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label>Gmail Address</label>
                        <input type="email" id="email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn">CREATE ACCOUNT</button>
                </form>
            </div>

            <!-- Verification Section (Hidden Initially) -->
            <div id="verifyContainer" style="display: none;">
                <h3 style="margin-bottom: 10px; color: #0d4a75;">Verify Your Email</h3>
                <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Please enter the verification code sent to your Google Sheet.</p>
                <div class="form-group">
                    <label>Verification Code</label>
                    <input type="text" id="enteredCode" placeholder="Enter 6-digit code" required>
                </div>
                <button type="button" class="btn-submit" onclick="verifyCode()">VERIFY CODE</button>
            </div>
        </div>
    </div>

    <footer>
        © 2026 Pintu Joydhar - All Rights Reserved.
    </footer>

    <script>
        // আপনার দেওয়া সঠিক Google Apps Script Web App URL এখানে যুক্ত করা হলো
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx30wLBUPjMcRdbuzrGXe-7NHBwCg0D9MLb7wbsIWYTfF5V8NlH_U6PO7CTBLBbWoy3ew/exec';

        function openModal() {
            document.getElementById('signupModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('signupModal').style.display = 'none';
        }

        function handleSignup(event) {
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');

            btn.innerText = "Processing...";
            btn.disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, email: email, password: password })
            })
            .then(() => {
                alert("Account details saved successfully! Please check your Google Sheet for the verification code.");
                document.getElementById('signupFormContainer').style.display = 'none';
                document.getElementById('verifyContainer').style.display = 'block';
            })
            .catch(error => {
                alert("Error! Please try again.");
                btn.innerText = "CREATE ACCOUNT";
                btn.disabled = false;
            });
        }

        function verifyCode() {
            const userCode = document.getElementById('enteredCode').value;
            if (userCode.length > 0) {
                alert("Verification Successful! Welcome to Pintu Joydhar's website.");
                closeModal();
                location.reload();
            } else {
                alert("Please enter a valid verification code.");
            }
        }
    </script>
</body>
</html>
