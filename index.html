<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintu Joydhar - Website</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-green: #7cc142;
            --brand-blue: #0099de;
            --brand-dark-blue: #1e2d3b;
            --bg-light: #f5f7fa;
            --text-dark: #333333;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* Top Bar */
        .top-bar {
            background: #ffffff;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4%;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 700;
            color: #0d4a75;
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--brand-green);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        .nav-menu li a {
            text-decoration: none;
            color: #0d4a75;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-count-badge {
            background: #eef2f7;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #0d4a75;
            border: 1px solid #d0dbe5;
        }

        .btn-signup {
            background: var(--brand-blue);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 8px;
            position: relative;
            text-align: center;
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        .btn-submit {
            width: 100%;
            background: var(--brand-blue);
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        footer {
            background: #111a22;
            color: #778899;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <a href="#" class="brand-logo">Pintu <span>Joydhar</span></a>
        <ul class="nav-menu">
            <li><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="#"><i class="fa-solid fa-heart"></i> My Life</a></li>
            <li><a href="#"><i class="fa-solid fa-blog"></i> Blog</a></li>
            <li>
                <span class="user-count-badge" id="userCountBadge">
                    <i class="fa-solid fa-users"></i> Subscribed: <span id="userCount">0</span>
                </span>
            </li>
        </ul>
        <button class="btn-signup" id="authBtn" onclick="openModal()">SIGN UP</button>
    </div>

    <!-- Signup Modal -->
    <div class="modal-overlay" id="signupModal">
        <div class="modal-box">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="signupFormContainer">
                <h3 style="margin-bottom: 5px; color: #0d4a75;">Get View Access</h3>
                <p style="font-size: 11px; color: #666; margin-bottom: 15px;">Enter your name and Gmail to proceed.</p>
                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label>Gmail Address</label>
                        <input type="email" id="email" placeholder="example@gmail.com" required>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn">SUBMIT & GET ACCESS</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        © 2026 Pintu Joydhar - All Rights Reserved.
    </footer>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxgmmGmYEUGUKLVFc4yp3bv4uO22YiSagsJ2lmGtytAndhEDYmVf5TXyDWbN8NFSVDCgA/exec';

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('isVerified') === 'true') {
                setVerifiedUI();
            }
            fetchUserCount();
        });

        function fetchUserCount() {
            fetch(scriptURL + '?rnd=' + Math.random(), { cache: 'no-store' })
                .then(response => response.json())
                .then(data => {
                    if (data && data.count !== undefined) {
                        document.getElementById('userCount').innerText = data.count;
                    }
                })
                .catch(error => {
                    console.error("Error fetching user count:", error);
                });
        }

        function openModal() {
            document.getElementById('signupModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('signupModal').style.display = 'none';
        }

        function handleSignup(event) {
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const btn = document.getElementById('submitBtn');

            btn.innerText = "Processing...";
            btn.disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, email: email })
            })
            .then(() => {
                localStorage.setItem('isVerified', 'true');
                alert("Successfully Signed Up!");
                closeModal();
                setVerifiedUI();
                
                setTimeout(() => {
                    fetchUserCount();
                }, 3000);
            })
            .catch(error => {
                localStorage.setItem('isVerified', 'true');
                alert("Successfully Signed Up!");
                closeModal();
                setVerifiedUI();
            });
        }

        function setVerifiedUI() {
            const authButton = document.getElementById('authBtn');
            authButton.innerText = "VERIFIED";
            authButton.style.background = "#7cc142";
            authButton.onclick = null;
        }
    </script>
</body>
</html>
