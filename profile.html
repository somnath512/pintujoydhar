<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Pintu Joydhar Portfolio</title>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --header-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --card-bg: #1e293b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .profile-card { background: var(--card-bg); padding: 40px 30px; border-radius: 16px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(56, 189, 248, 0.2); position: relative; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: rgba(56, 189, 248, 0.1); color: var(--accent-color); font-size: 40px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; border: 3px solid var(--accent-color); }
        .profile-name { font-size: 24px; font-weight: bold; margin-bottom: 5px; color: var(--text-main); }
        .profile-title { color: var(--accent-color); font-size: 15px; font-weight: 600; margin-bottom: 20px; }
        .profile-info-box { background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 10px; text-align: left; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-sub); }
        .info-value { font-weight: 500; color: var(--text-main); }
        .btn-group { display: flex; gap: 12px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; border: none; font-size: 14px; transition: 0.2s; }
        .btn-home { background: var(--accent-color); color: #0f172a; }
        .btn-home:hover { opacity: 0.9; }
        .btn-logout { background: #ef4444; color: #ffffff; }
        .btn-logout:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="profile-avatar">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="profile-name" id="displayName">User Name</div>
        <div class="profile-title" id="displayTitle">User Title</div>

        <div class="profile-info-box">
            <div class="info-row">
                <span class="info-label"><i class="fa-solid fa-envelope"></i> Gmail:</span>
                <span class="info-value" id="displayEmail">email@gmail.com</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fa-solid fa-venus-mars"></i> Gender:</span>
                <span class="info-value" id="displayGender">-</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fa-solid fa-calendar"></i> Date of Birth:</span>
                <span class="info-value" id="displayDob">-</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-home" onclick="window.location.href='index.html'">Go to News Feed</button>
            <button class="btn btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <script>
        // LocalStorage থেকে ইউজারের ডাটা লোড করে প্রোফাইলে দেখানো
        document.getElementById('displayName').innerText = localStorage.getItem('savedUser') || 'Pintu Joydhar';
        document.getElementById('displayTitle').innerText = localStorage.getItem('savedTitle') || 'Portfolio Member';
        document.getElementById('displayEmail').innerText = localStorage.getItem('savedEmail') || 'user@gmail.com';
        document.getElementById('displayGender').innerText = localStorage.getItem('savedGender') || 'Not Specified';
        document.getElementById('displayDob').innerText = localStorage.getItem('savedDob') || 'Not Specified';

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
