<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Writing & Poetry</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px 15px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid var(--accent-color);
            padding: 8px 18px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-color);
            color: #fff;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        h1 span {
            color: var(--accent-color);
        }

        p.subtitle {
            color: var(--text-sub);
            margin-bottom: 25px;
        }

        /* 📱 Mobile & Desktop Friendly PDF Frame */
        .pdf-viewer-container {
            width: 100%;
            height: 80vh;
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ব্যাক বাটন -->
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান</a>

        <h1>My <span>Poetry & Content</span></h1>
        <p class="subtitle">নিচে কবিতাটি সরাসরি পড়তে পারবেন</p>

        <!-- 📄 PDF Viewer (শুধুমাত্র দেখা যাবে) -->
        <div class="pdf-viewer-container">
            <!-- 📌 আপনার ফাইলের নাম 'tumi-elei.pdf' দেওয়া হয়েছে -->
            <iframe src="tumi-elei.pdf#toolbar=0"></iframe>
        </div>
    </div>

</body>
</html>
