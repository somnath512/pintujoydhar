<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Writing & Poetry</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 15px;
            text-align: center;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 25px;
            border: 1px solid var(--accent-color);
            padding: 8px 20px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-color);
            color: #fff;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        h1 span {
            color: var(--accent-color);
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* 📜 Poetry Container Styles */
        .poetry-card {
            background: var(--card-bg);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 40px 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin-bottom: 30px;
        }

        .poem-title {
            font-size: 24px;
            color: var(--accent-color);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .poem-content {
            font-size: 18px;
            line-height: 2.2;
            color: var(--text-main);
            white-space: pre-line; /* লাইন ব্রেক ঠিক রাখার জন্য */
            font-style: italic;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }
            .poetry-card {
                padding: 25px 15px;
            }
            .poem-content {
                font-size: 16px;
                line-height: 2;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ব্যাক বাটন -->
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান</a>

        <h1>My <span>Poetry & Content</span></h1>
        <p class="subtitle">আমার লেখা কিছু নির্বাচিত কবিতা</p>

        <!-- ✍️ কবিতা বক্স ১ -->
        <div class="poetry-card">
            <h2 class="poem-title">তুমি এলেই</h2>
            <p class="poem-content">
                বলছিলাম—তোমার কাছে আসলে আমার হার্টবিট যায় বেড়ে,
                তুমি বললে, "মজা পেলাম কথা শুনে"...
                
                মেঘ জমেছিল রাতের আকাশে,
                এক ফোঁটা বৃষ্টি ঝরে পড়ে তোমার ছোঁয়ায়।
                নীরব রাতের শেষ প্রহরে,
                তুমি এলেই নতুন কোনো স্বপ্ন জাগায়।
            </p>
        </div>

        <!-- ✍️ প্রয়োজন হলে নতুন কবিতা যোগ করার জন্য আরেকটা কার্ড -->
        <!-- 
        <div class="poetry-card">
            <h2 class="poem-title">দ্বিতীয় কবিতার শিরোনাম</h2>
            <p class="poem-content">
                এখানে পরবর্তী কবিতার লাইনগুলো লিখবে...
            </p>
        </div> 
        -->

    </div>

</body>
</html>
