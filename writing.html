<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Writing & Poetry</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px 10px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid var(--accent-color);
            padding: 8px 18px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--accent-color);
            color: #fff;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        h1 span {
            color: var(--accent-color);
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* 📱 Mobile Optimized PDF Box */
        .pdf-viewer-container {
            width: 100%;
            height: 75vh; /* মোবাইলের স্ক্রিনের ৭৫% জায়গা নিয়ে সুন্দরভাবে ফিট হবে */
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* মোবাইল ডিভাইসের জন্য স্পেশাল এডজাস্টমেন্ট */
        @media (max-width: 600px) {
            body {
                padding: 15px 8px;
            }
            .pdf-viewer-container {
                height: 80vh; /* মোবাইলে স্ক্রিনের আরও বেশি জায়গা নিবে */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ব্যাক বাটন -->
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান</a>

        <h1>My <span>Poetry & Content</span></h1>
        <p class="subtitle">নিচে কবিতাটি অনলাইনে সরাসরি পড়তে পারবেন</p>

        <!-- 📄 Mobile Responsive PDF Viewer -->
        <div class="pdf-viewer-container">
            <!-- Google PDF Viewer Engine: যা মোবাইলে খুব স্মুথলি ফাইল দেখায় -->
            <iframe src="https://docs.google.com/viewer?url=https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/tumi-elei.pdf&embedded=true"></iframe>
        </div>
    </div>

</body>
</html>
