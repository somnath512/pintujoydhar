<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading & Accounting Calculator - Pintu Joydhar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .calc-card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .calc-card h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 22px;
    }

    /* ডিসপ্লে স্ক্রিন */
    #display {
      width: 100%;
      height: 60px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #38bdf8;
      font-size: 28px;
      font-weight: bold;
      text-align: right;
      padding: 10px 15px;
      margin-bottom: 20px;
      outline: none;
    }

    /* বাটন গ্রিড Layout */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #334155;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #475569;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* স্পেশাল বাটন কালার */
    .btn-op {
      background: #0284c7;
      color: #fff;
    }
    .btn-op:hover {
      background: #0369a1;
    }

    .btn-clear {
      background: #ef4444;
      color: #fff;
    }
    .btn-clear:hover {
      background: #dc2626;
    }

    .btn-equal {
      background: #38bdf8;
      color: #0f172a;
      grid-column: span 2;
    }
    .btn-equal:hover {
      background: #0284c7;
      color: #fff;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
    }
    .back-btn:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="calc-card">
    <h2><i class="fa-solid fa-calculator"></i> Calculator</h2>
    
    <!-- ডিসপ্লে এলাকা -->
    <input type="text" id="display" readonly value="0">

    <!-- ক্যালকুলেটর বাটনসমূহ -->
    <div class="buttons-grid">
      <button class="btn btn-clear" onclick="clearDisplay()">C</button>
      <button class="btn btn-op" onclick="deleteLast()"><i class="fa-solid fa-backspace"></i></button>
      <button class="btn btn-op" onclick="appendValue('/')">÷</button>
      <button class="btn btn-op" onclick="appendValue('*')">×</button>

      <button class="btn" onclick="appendValue('7')">7</button>
      <button class="btn" onclick="appendValue('8')">8</button>
      <button class="btn" onclick="appendValue('9')">9</button>
      <button class="btn btn-op" onclick="appendValue('-')">-</button>

      <button class="btn" onclick="appendValue('4')">4</button>
      <button class="btn" onclick="appendValue('5')">5</button>
      <button class="btn" onclick="appendValue('6')">6</button>
      <button class="btn btn-op" onclick="appendValue('+')">+</button>

      <button class="btn" onclick="appendValue('1')">1</button>
      <button class="btn" onclick="appendValue('2')">2</button>
      <button class="btn" onclick="appendValue('3')">3</button>
      <button class="btn btn-op" onclick="appendValue('%')">%</button>

      <button class="btn" onclick="appendValue('0')">0</button>
      <button class="btn" onclick="appendValue('.')">.</button>
      <button class="btn btn-equal" onclick="calculateResult()">=</button>
    </div>

    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
  </div>

  <script>
    const display = document.getElementById('display');

    // মান ইনপুট দেওয়ার জন্য
    function appendValue(val) {
      if (display.value === '0' || display.value === 'Error') {
        display.value = val;
      } else {
        display.value += val;
      }
    }

    // অল ক্লিয়ার করার জন্য
    function clearDisplay() {
      display.value = '0';
    }

    // ব্যাকস্পেস (একটি সংখ্যা মোছা)
    function deleteLast() {
      if (display.value.length === 1 || display.value === 'Error') {
        display.value = '0';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    // আসল হিসাব (Calculation) করার ফাংশন
    function calculateResult() {
      try {
        // পার্সেন্টেজ (%) হিসাব করার সহজ লজিক
        let expression = display.value.replace(/%/g, '/100');
        
        // Math Calculation করে রেজাল্ট দেখাবে
        let result = eval(expression);

        // দশমিকের পর অতিরিক্ত ঘর থাকলে সুন্দরভাবে রাউন্ড করবে
        if (Number.isInteger(result)) {
          display.value = result;
        } else {
          display.value = parseFloat(result.toFixed(4));
        }
      } catch (error) {
        display.value = 'Error';
      }
    }
  </script>

</body>
</html>
