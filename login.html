<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - Pintu Joydhar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #f8fafc;
    }

    .login-card {
      background: #1e293b;
      padding: 35px 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .login-card h2 {
      margin-bottom: 10px;
      color: #38bdf8;
      font-size: 24px;
    }

    /* মোট মেম্বার কাউন্টার স্টাইল */
    .user-count-badge {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .login-card input:focus {
      border-color: #38bdf8;
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-card button:hover {
      background: #0284c7;
      color: #ffffff;
    }

    .login-card p {
      margin-top: 18px;
      font-size: 14px;
      color: #94a3b8;
    }

    .login-card a {
      color: #38bdf8;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2 id="formTitle">Login</h2>
    
    <!-- মোট সাইন-আপ করা ইউজারের সংখ্যা -->
    <div class="user-count-badge">
      👥 Total Members: <span id="totalUsersCount">0</span>
    </div>

    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    
    <button id="authBtn" onclick="handleAuth()">Login</button>
    
    <p>
      <span id="toggleMsg">Don't have an account?</span> 
      <a href="#" onclick="toggleMode()" id="toggleLink">Sign Up</a>
    </p>
  </div>

  <script>
    // ১. ইউজার আগে থেকে লগইন থাকলে সরাসরি index.html-এ নিয়ে যাবে
    if (localStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = 'index.html';
    }

    // ২. চেক করবে একাউন্ট আছে কিনা
    const hasAccount = localStorage.getItem('savedUser') !== null;
    let isSignUpMode = !hasAccount;

    window.onload = function() {
      updateFormUI();
      fetchTotalUsers();
    };

    function toggleMode() {
      isSignUpMode = !isSignUpMode;
      updateFormUI();
    }

    function updateFormUI() {
      const title = document.getElementById('formTitle');
      const btn = document.getElementById('authBtn');
      const msg = document.getElementById('toggleMsg');
      const link = document.getElementById('toggleLink');

      if (isSignUpMode) {
        title.innerText = 'Create Account';
        btn.innerText = 'Sign Up';
        msg.innerText = 'Already have an account?';
        link.innerText = 'Login';
      } else {
        title.innerText = 'Login';
        btn.innerText = 'Login';
        msg.innerText = "Don't have an account?";
        link.innerText = 'Create Account';
      }
    }

    // মোট ইউজারের সংখ্যা দেখানো
    function fetchTotalUsers() {
      let count = localStorage.getItem('globalUserCount') || 1;
      document.getElementById('totalUsersCount').innerText = count;
    }

    function handleAuth() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!user || !pass) {
        alert('Please enter both Username and Password!');
        return;
      }

      if (isSignUpMode) {
        // নতুন সাইন আপ হলে কাউন্ট ১ বাড়বে
        let currentCount = parseInt(localStorage.getItem('globalUserCount') || 1);
        currentCount += 1;
        localStorage.setItem('globalUserCount', currentCount);

        localStorage.setItem('savedUser', user);
        localStorage.setItem('savedPass', pass);
        localStorage.setItem('isLoggedIn', 'true');
        
        alert('Account created successfully!');
        window.location.href = 'index.html';
      } else {
        const savedUser = localStorage.getItem('savedUser');
        const savedPass = localStorage.getItem('savedPass');

        if (user === savedUser && pass === savedPass) {
          localStorage.setItem('isLoggedIn', 'true');
          alert('Logged in successfully!');
          window.location.href = 'index.html';
        } else {
          alert('Invalid Username or Password!');
        }
      }
    }
  </script>

</body>
</html>
