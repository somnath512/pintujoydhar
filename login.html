<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - Pintu Joydhar</title>
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      // আপনার EmailJS Public Key এখানে বসাবেন
      emailjs.init("YOUR_PUBLIC_KEY");
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #f8fafc; padding: 20px; }
    .login-card { background: #1e293b; padding: 35px 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); border: 1px solid rgba(56, 189, 248, 0.2); }
    .login-card h2 { margin-bottom: 15px; color: #38bdf8; font-size: 24px; }
    .user-count-badge { background: rgba(56, 189, 248, 0.1); color: #38bdf8; display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 20px; border: 1px solid rgba(56, 189, 248, 0.3); }
    .login-card input, .login-card select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; font-size: 14px; outline: none; transition: border-color 0.3s; }
    .login-card input:focus, .login-card select:focus { border-color: #38bdf8; }
    .login-card select { cursor: pointer; }
    .login-card button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.3s ease; }
    .login-card button:hover { background: #0284c7; color: #ffffff; }
    .login-card p { margin-top: 18px; font-size: 14px; color: #94a3b8; }
    .login-card a { color: #38bdf8; font-weight: bold; text-decoration: none; cursor: pointer; }
    .hidden { display: none; }
    .input-label { text-align: left; font-size: 12px; color: #94a3b8; margin-bottom: 5px; display: block; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2 id="formTitle">Login</h2>
    
    <div class="user-count-badge">
      👥 Total Members: <span id="totalUsersCount">15</span>
    </div>

    <!-- Login Form Fields (Only Gmail & Password) -->
    <div id="loginInputs">
      <input type="email" id="loginEmail" placeholder="Gmail Address">
      <input type="password" id="loginPassword" placeholder="Password">
    </div>

    <!-- Sign Up Form Fields (Name, Title, Gmail, Gender, DOB, Password) -->
    <div id="signupInputs" class="hidden">
      <input type="text" id="signupName" placeholder="Full Name">
      <input type="text" id="signupTitle" placeholder="Title (e.g. Junior Accountant / Web Developer)">
      <input type="email" id="signupEmail" placeholder="Gmail Address">
      
      <select id="signupGender">
        <option value="" disabled selected>Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <label class="input-label">Date of Birth</label>
      <input type="date" id="signupDob">
      
      <input type="password" id="signupPassword" placeholder="Create Password">
    </div>

    <!-- OTP Verification Section (Hidden initially) -->
    <div id="otpSection" class="hidden">
      <p style="color: #38bdf8; margin-bottom: 10px;">Verification code sent to your Gmail! Enter it below:</p>
      <input type="text" id="otpInput" placeholder="Enter 4-digit OTP" maxlength="4">
      <button onclick="verifyOTP()">Verify & Complete</button>
    </div>

    <button id="authBtn" onclick="handleAuth()">Login</button>
    
    <p id="toggleContainer">
      <span id="toggleMsg">Don't have an account?</span> 
      <a onclick="toggleMode()" id="toggleLink">Sign Up</a>
    </p>
  </div>

  <script>
    const sheetScriptURL = 'https://script.google.com/macros/s/AKfycbw4AIjSfR-n-Rb4k7VK5txEd84uuOYx55lRv7apGcIE5eYDgm5zb5w1iH0ywlqu3dRGOA/exec';

    if (localStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = 'index.html';
    }

    let isSignUpMode = false;
    let generatedOTP = '';
    let tempUserData = {};

    function toggleMode() {
      isSignUpMode = !isSignUpMode;
      const title = document.getElementById('formTitle');
      const btn = document.getElementById('authBtn');
      const msg = document.getElementById('toggleMsg');
      const link = document.getElementById('toggleLink');
      const loginDiv = document.getElementById('loginInputs');
      const signupDiv = document.getElementById('signupInputs');

      if (isSignUpMode) {
        title.innerText = 'Create Account';
        btn.innerText = 'Send OTP & Register';
        msg.innerText = 'Already have an account?';
        link.innerText = 'Login';
        loginDiv.classList.add('hidden');
        signupDiv.classList.remove('hidden');
      } else {
        title.innerText = 'Login';
        btn.innerText = 'Login';
        msg.innerText = "Don't have an account?";
        link.innerText = 'Create Account';
        signupDiv.classList.add('hidden');
        loginDiv.classList.remove('hidden');
      }
    }

    function handleAuth() {
      if (isSignUpMode) {
        const name = document.getElementById('signupName').value.trim();
        const title = document.getElementById('signupTitle').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const gender = document.getElementById('signupGender').value;
        const dob = document.getElementById('signupDob').value;
        const pass = document.getElementById('signupPassword').value.trim();

        if (!name || !title || !email || !gender || !dob || !pass) {
          alert('Please fill in all sign-up fields!');
          return;
        }

        generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
        tempUserData = { 
          name: name, 
          title: title, 
          identifier: email, 
          gender: gender, 
          dob: dob, 
          password: pass 
        };

        const templateParams = {
          to_email: email,
          otp: generatedOTP
        };

        // EmailJS এর মাধ্যমে জিমেইলে ওটিপি পাঠানো
        emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
          .then(function(response) {
             alert('OTP sent successfully to your Gmail: ' + email);
             document.getElementById('signupInputs').classList.add('hidden');
             document.getElementById('otpSection').classList.remove('hidden');
             document.getElementById('authBtn').classList.add('hidden');
             document.getElementById('toggleContainer').classList.add('hidden');
             document.getElementById('formTitle').innerText = 'Verify Security OTP';
          }, function(error) {
             console.error('FAILED...', error);
             alert('Failed to send email. Please check your EmailJS settings.');
          });

      } else {
        // লগইন করার সময় শুধু জিমেইল এবং পাসওয়ার্ড চেক করবে
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPassword').value.trim();

        if (!email || !pass) {
          alert('Please enter your Gmail and Password!');
          return;
        }

        const savedEmail = localStorage.getItem('savedEmail');
        const savedPass = localStorage.getItem('savedPass');
        const savedName = localStorage.getItem('savedUser');

        if (email === savedEmail && pass === savedPass) {
          localStorage.setItem('isLoggedIn', 'true');
          alert('Logged in successfully!');
          window.location.href = 'index.html';
        } else {
          alert('Invalid Gmail or Password!');
        }
      }
    }

    function verifyOTP() {
      const enteredOTP = document.getElementById('otpInput').value.trim();
      if (enteredOTP === generatedOTP) {
        // ওটিপি সঠিক হলে গুগল শিটে সব ডাটা সেভ হয়ে যাবে
        fetch(sheetScriptURL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(tempUserData)
        })
        .then(() => {
          localStorage.setItem('savedUser', tempUserData.name);
          localStorage.setItem('savedEmail', tempUserData.identifier);
          localStorage.setItem('savedPass', tempUserData.password);
          localStorage.setItem('isLoggedIn', 'true');
          alert('Account verified and created successfully!');
          window.location.href = 'index.html';
        })
        .catch(error => {
          localStorage.setItem('savedUser', tempUserData.name);
          localStorage.setItem('savedEmail', tempUserData.identifier);
          localStorage.setItem('savedPass', tempUserData.password);
          localStorage.setItem('isLoggedIn', 'true');
          window.location.href = 'index.html';
        });

      } else {
        alert('Invalid OTP Code! Please try again.');
      }
    }
  </script>

</body>
</html>
