<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pintu Joydhar Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpZPB6T_aXRD1LtIoEhW_vfPtdxYXX9P0",
            authDomain: "pintu-joydhar.firebaseapp.com",
            projectId: "pintu-joydhar",
            storageBucket: "pintu-joydhar.firebasestorage.app",
            messagingSenderId: "119458106001",
            appId: "1:119458106001:web:024bd1961ec3fc019b0d30",
            measurementId: "G-BG1TBM8DEE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // লোকাল স্টোরেজে জিমেইলের নাম এবং ইমেইল সেভ করা
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('savedUser', user.displayName || user.email);

                // মূল পেজে রিডাইরেক্ট করা
                window.location.replace('index.html');
            } catch (error) {
                console.error("Google Login Error: ", error);
                document.getElementById('errorMsg').innerText = "Google Login Failed! Try again.";
                document.getElementById('errorMsg').style.display = 'block';
            }
        };
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --input-bg: #334155;
            --input-text: #ffffff;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-color: #0284c7;
            --input-bg: #f1f5f9;
            --input-text: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 10px;
            font-size: 26px;
        }

        .login-card h2 span {
            color: var(--accent-color);
        }

        .login-card p {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .btn-google {
            width: 100%;
            background: #ffffff;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .btn-google:hover {
            background: #f1f5f9;
        }

        .btn-google i {
            color: #ea4335;
            font-size: 18px;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Welcome <span>Back</span></h2>
        <p>Sign in quickly using your Google Account</p>
        
        <button class="btn-google" onclick="loginWithGoogle()">
            <i class="fa-brands fa-google"></i> Continue with Google
        </button>

        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script>
        // যদি ইউজার ইতিমধ্যেই লগইন করা থাকে, তবে সরাসরি ইনডেক্স পেজে পাঠিয়ে দিবে
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
