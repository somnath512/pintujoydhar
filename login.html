<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfolio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --input-bg: #334155;
            --input-text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 10px;
            font-size: 26px;
        }

        .login-card h2 span {
            color: var(--accent-color);
        }

        .login-card p {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid #475569;
            border-radius: 8px;
            color: var(--input-text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Welcome <span>Back</span></h2>
        <p>Please enter your name to continue</p>
        
        <div class="input-group">
            <label for="username">Your Name</label>
            <input type="text" id="username" placeholder="Enter your name">
        </div>

        <button class="btn-submit" onclick="handleLogin()">Login</button>

        <div id="errorMsg" class="error-msg">Please enter a valid name.</div>
    </div>

    <script>
        // যদি ইউজার ইতিমধ্যেই লগইন করা থাকে, সরাসরি ইনডেক্স পেজে পাঠাবে
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.replace('index.html');
        }

        function handleLogin() {
            const nameInput = document.getElementById('username').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (nameInput === "") {
                errorMsg.style.display = 'block';
            } else {
                errorMsg.style.display = 'none';
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('savedUser', nameInput);
                window.location.replace('index.html');
            }
        }
    </script>
</body>
</html>
