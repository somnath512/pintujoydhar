<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - Portfolio & News Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-96 border border-slate-700">
        <h2 id="form-title" class="text-2xl font-bold mb-6 text-center text-indigo-400">Login</h2>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div id="register-fields" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Full Name</label>
                    <input type="text" id="name" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Title / Profession</label>
                    <input type="text" id="title" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500" placeholder="e.g. Web Developer">
                </div>
                <div class="flex space-x-2">
                    <div class="w-1/2">
                        <label class="block text-sm font-medium mb-1">Gender</label>
                        <select id="gender" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-medium mb-1">Date of Birth</label>
                        <input type="date" id="dob" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <label class="block text-sm font-medium mb-1">Gmail Address</label>
                <input type="email" id="email" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
            </div>

            <div class="mt-4">
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
            </div>

            <div id="otp-section" class="hidden mt-4">
                <label class="block text-sm font-medium mb-1">Enter OTP Code Sent to Email</label>
                <input type="text" id="otp-input" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 tracking-widest text-center text-lg font-bold">
            </div>

            <button type="submit" id="submit-btn" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-500 transition py-2.5 rounded-lg font-semibold shadow-lg">Login</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-400">
            <span id="toggle-text">Don't have an account?</span> 
            <button onclick="toggleMode()" class="text-indigo-400 font-medium hover:underline ml-1">Register</button>
        </p>
    </div>

    <script>
        let isLogin = true;
        let generatedOtp = '';
        let pendingUserData = null;

        function toggleMode() {
            isLogin = !isLogin;
            const title = document.getElementById('form-title');
            const regFields = document.getElementById('register-fields');
            const submitBtn = document.getElementById('submit-btn');
            const toggleText = document.getElementById('toggle-text');
            const toggleBtn = document.querySelector('p button');

            if (isLogin) {
                title.innerText = 'Login';
                regFields.classList.add('hidden');
                submitBtn.innerText = 'Login';
                toggleText.innerText = "Don't have an account?";
                toggleBtn.innerText = 'Register';
            } else {
                title.innerText = 'Register';
                regFields.classList.remove('hidden');
                submitBtn.innerText = 'Send OTP & Register';
                toggleText.innerText = "Already have an account?";
                toggleBtn.innerText = 'Login';
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const otpSection = document.getElementById('otp-section');
            const submitBtn = document.getElementById('submit-btn');

            if (isLogin) {
                const savedUser = JSON.parse(localStorage.getItem('userProfile'));
                if (savedUser && savedUser.email === email && savedUser.password === password) {
                    alert('Login Successful!');
                    window.location.href = 'index.html';
                } else {
                    alert('Invalid Email or Password!');
                }
            } else {
                if (otpSection.classList.contains('hidden')) {
                    generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
                    
                    pendingUserData = {
                        name: document.getElementById('name').value,
                        title: document.getElementById('title').value,
                        gender: document.getElementById('gender').value,
                        dob: document.getElementById('dob').value,
                        email: email,
                        password: password
                    };

                    submitBtn.innerText = 'Sending OTP...';
                    submitBtn.disabled = true;

                    // আপনার দেওয়া Google Apps Script URL এখানে বসানো হয়েছে
                    const scriptURL = 'https://script.google.com/macros/s/AKfycbx_n_QSjyND_SG1kQe5ZDozIV92XCoxSbnPUvKd2kNrPyowjQmXMMSPCpcm0F4ukpSD/exec';

                    fetch(scriptURL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            otp: generatedOtp
                        })
                    })
                    .then(() => {
                        alert('OTP sent successfully to your Gmail from your account!');
                        otpSection.classList.remove('hidden');
                        submitBtn.innerText = 'Verify & Complete Signup';
                        submitBtn.disabled = false;
                    })
                    .catch(error => {
                        console.log(error);
                        alert('Something went wrong!');
                        submitBtn.innerText = 'Send OTP & Register';
                        submitBtn.disabled = false;
                    });

                } else {
                    const enteredOtp = document.getElementById('otp-input').value;
                    if (enteredOtp === generatedOtp) {
                        localStorage.setItem('userProfile', JSON.stringify(pendingUserData));
                        alert('Account Created Successfully!');
                        window.location.href = 'profile.html';
                    } else {
                        alert('Invalid OTP! Please try again.');
                    }
                }
            }
        }
    </script>
</body>
</html>
