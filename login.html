<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Portfolio & News Feed</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-96 border border-slate-700">
        <h2 class="text-2xl font-bold mb-2 text-center text-indigo-400">Welcome</h2>
        <p class="text-xs text-slate-400 text-center mb-6">Enter your details to enter the platform</p>

        <form onsubmit="enterSite(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Your Name</label>
                <input type="text" id="username" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500" placeholder="e.g. John Doe">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Profession / Title</label>
                <input type="text" id="usertitle" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500" placeholder="e.g. Web Developer">
            </div>

            <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 transition py-2.5 rounded-lg font-semibold shadow-lg">Enter Website</button>
        </form>
    </div>

    <script>
        function enterSite(event) {
            event.preventDefault();
            
            // ইউজারের নাম ও প্রফেশন সেভ করে রাখা যাতে সাইটে শো করানো যায়
            const userData = {
                name: document.getElementById('username').value,
                title: document.getElementById('usertitle').value
            };

            localStorage.setItem('userProfile', JSON.stringify(userData));
            
            // সরাসরি মূল পেজে নিয়ে যাবে
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
